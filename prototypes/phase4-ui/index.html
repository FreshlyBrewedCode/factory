<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>factory — phase 4 ui mock</title>
<!--
  PHASE 4 UI THROWAWAY MOCKUP — purely visual, no backend.
  Design language lifted from wayful/design/design.md (achromatic instrument
  panel, status-only colour, amber highlight, mono for CLI-typeable handles).
  Fonts via CDN here on purpose: the self-hosting rule in design.md exists
  because wayful's client ships inside a binary; this file is a throwaway.
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
/* ---------------------------------------------------------------- tokens */
:root, [data-theme="light"] {
  --background: oklch(0.96 0 0);
  --card: oklch(1 0 0);
  --on-surface: oklch(0.21 0 0);
  --muted: oklch(0.958 0 0);
  --muted-foreground: oklch(0.52 0 0);
  --accent: oklch(0.945 0 0);
  --border: oklch(0.9 0 0);
  --border-strong: oklch(0.78 0 0);
  --primary: oklch(0.86 0.176 89.2);
  --primary-foreground: oklch(0.2 0 0);
  --ring: var(--primary);
  --st-complete: oklch(0.58 0.14 158);
  --st-ready: oklch(0.58 0.13 70);
  --st-pending: oklch(0.55 0.17 262);
  --st-blocked: oklch(0.56 0.2 25);
  --st-cancelled: oklch(0.6 0.02 258);
  --term-bg: oklch(0.19 0 0);
  --term-fg: oklch(0.85 0 0);
  color-scheme: light;
}
[data-theme="dark"] {
  --background: oklch(0.16 0 0);
  --card: oklch(0.23 0 0);
  --on-surface: oklch(0.93 0 0);
  --muted: oklch(0.27 0 0);
  --muted-foreground: oklch(0.71 0 0);
  --accent: oklch(0.3 0 0);
  --border: oklch(0.32 0 0);
  --border-strong: oklch(0.45 0 0);
  --st-complete: oklch(0.81 0.16 163);
  --st-ready: oklch(0.84 0.13 80);
  --st-pending: oklch(0.75 0.13 265);
  --st-blocked: oklch(0.73 0.15 22);
  --st-cancelled: oklch(0.6 0.02 258);
  --term-bg: oklch(0.13 0 0);
  --term-fg: oklch(0.85 0 0);
  color-scheme: dark;
}

/* status mapping — the one place colour is allowed to mean something */
[data-status="finished"], [data-status="complete"], [data-status="completed"], [data-status="pass"] { --status: var(--st-complete); }
[data-status="running"]   { --status: var(--st-pending); }
[data-status="failed"], [data-status="fail"] { --status: var(--st-blocked); }
[data-status="cancelled"] { --status: var(--st-cancelled); }
[data-status="interrupted"] { --status: var(--st-ready); }

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--background);
  color: var(--on-surface);
  font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 13px;
  line-height: 1.45;
  overflow: hidden;
}
.mono, code, pre, kbd { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
pre { margin: 0; }
a { color: inherit; }
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; padding: 0; text-align: left; }
::selection { background: color-mix(in oklab, var(--primary) 45%, transparent); }

/* ---------------------------------------------------------------- topbar */
.topbar {
  height: 56px;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 16px;
  border-bottom: 1px solid var(--border);
  background: var(--background);
}
.brand { display: flex; align-items: center; gap: 9px; min-width: 0; }
.brand-mark {
  width: 26px; height: 26px; border-radius: 9999px;
  background: var(--primary);
  color: var(--primary-foreground);
  display: grid; place-items: center;
  font-family: "JetBrains Mono", monospace; font-size: 14px; font-weight: 600;
  flex: none;
}
.brand-name { font-family: "JetBrains Mono", monospace; font-size: 1.125rem; font-weight: 600; letter-spacing: -0.01em; }
.brand-sub { font-size: 0.875rem; color: var(--muted-foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 14px; }
.sim-badge {
  font-family: "JetBrains Mono", monospace; font-size: 11px;
  color: var(--muted-foreground);
  border: 1px dashed var(--border-strong);
  border-radius: 10px; padding: 3px 8px;
  white-space: nowrap;
}
.live-indicator { display: flex; align-items: center; gap: 6px; font-size: 0.875rem; color: var(--muted-foreground); }
.live-dot { width: 6px; height: 6px; border-radius: 9999px; background: var(--st-complete); }
.live-dot.pulse { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }
.icon-btn {
  width: 32px; height: 32px; border-radius: 10px;
  display: grid; place-items: center;
  color: var(--muted-foreground);
  border: 1px solid transparent;
}
.icon-btn:hover { background: var(--accent); color: var(--on-surface); }
.hamburger { display: none; }

/* ---------------------------------------------------------------- shell */
.shell {
  display: grid;
  grid-template-columns: 212px 1fr minmax(300px, 26%);
  height: calc(100% - 56px);
}
.nav, .inspector {
  overflow-y: auto;
  background: var(--background);
}
.nav { border-right: 1px solid var(--border); }
.inspector { border-left: 1px solid var(--border); }
.main { overflow-y: auto; position: relative; }

/* ---------------------------------------------------------------- shared bits */
.section-label {
  font-size: 11px; font-weight: 600; letter-spacing: 0.025em;
  text-transform: uppercase;
  color: var(--muted-foreground);
}
.pill {
  font-family: "JetBrains Mono", monospace; font-size: 11px; line-height: 1;
  padding: 4px 8px; border-radius: 10px;
  background: color-mix(in oklab, var(--status, var(--muted-foreground)) 16%, transparent);
  border: 1px solid color-mix(in oklab, var(--status, var(--muted-foreground)) 45%, transparent);
  color: var(--status, var(--muted-foreground));
  white-space: nowrap;
}
.pill.neutral {
  background: var(--muted);
  border-color: var(--border);
  color: var(--muted-foreground);
}
.chip {
  font-family: "JetBrains Mono", monospace; font-size: 11px;
  background: var(--muted);
  border-radius: 10px; padding: 3px 8px;
  color: var(--on-surface);
  white-space: nowrap;
}
.chip .k { color: var(--muted-foreground); }
.hairline { height: 1px; background: var(--border); border: none; margin: 0; }

/* ---------------------------------------------------------------- nav */
.nav { padding: 10px; }
.nav-menu { display: grid; gap: 2px; }
.nav-item {
  display: flex; align-items: center; gap: 10px;
  width: 100%;
  padding: 8px 10px;
  border-radius: 8px;
  color: var(--muted-foreground);
  font-size: 0.8125rem; font-weight: 500;
}
.nav-item:hover { background: var(--accent); color: var(--on-surface); }
.nav-item[aria-current="true"] { background: var(--accent); color: var(--on-surface); }
.nav-item .nav-icon { flex: none; display: grid; place-items: center; width: 15px; color: inherit; }
.nav-item .nav-count { margin-left: auto; font-family: "JetBrains Mono", monospace; font-size: 11px; font-weight: 400; color: var(--muted-foreground); }
.nav-item[aria-current="true"] .nav-count { color: var(--on-surface); }

/* ---------------------------------------------------------------- pages */
.page-wrap { padding: 24px 24px 60px; max-width: 920px; }
.page-head { display: flex; align-items: baseline; gap: 12px; margin: 0 0 22px; flex-wrap: wrap; }
.page-title { font-size: 1.125rem; font-weight: 600; }
.page-sub { font-size: 11px; color: var(--muted-foreground); font-family: "JetBrains Mono", monospace; }
.page-section { display: grid; gap: 10px; margin-bottom: 28px; }
.page-section > .section-label { display: flex; align-items: baseline; gap: 8px; }
.page-section > .section-label .count { font-family: "JetBrains Mono", monospace; font-weight: 400; }

.workflow-card { background: var(--card); border: 1px solid var(--border); padding: 14px 16px; display: grid; gap: 10px; }
.workflow-card .wf-name { font-family: "JetBrains Mono", monospace; font-size: 14px; font-weight: 500; }
.workflow-card .wf-desc { font-size: 0.8125rem; color: var(--muted-foreground); line-height: 1.5; }
.workflow-card .wf-meta { display: flex; gap: 6px; flex-wrap: wrap; }

.dispatch-source { font-family: "JetBrains Mono", monospace; font-size: 11px; color: var(--muted-foreground); }
.wip-row { display: flex; align-items: center; gap: 10px; font-family: "JetBrains Mono", monospace; font-size: 11px; color: var(--muted-foreground); }
.wip-bar { flex: 1; height: 6px; border-radius: 9999px; background: var(--muted); overflow: hidden; }
.wip-bar > i { display: block; height: 100%; background: var(--st-pending); border-radius: 9999px; }
.queue-item {
  background: var(--card); border: 1px solid var(--border);
  padding: 10px 12px; display: grid; gap: 3px;
  border-left: 3px solid var(--border);
  width: 100%;
}
.queue-item[data-status] { border-left-color: var(--status); }
.queue-item .qi-title { font-size: 0.8125rem; line-height: 1.4; }
.queue-item .qi-meta { font-family: "JetBrains Mono", monospace; font-size: 11px; color: var(--muted-foreground); display: flex; gap: 8px; align-items: center; }

.dot-sep::before { content: "·"; margin-right: 8px; }

/* ---------------------------------------------------------------- runs table */
.runs-wrap { padding: 20px 24px 60px; }
.runs-group { margin-bottom: 28px; }
.runs-group-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.runs-group-head .count { font-family: "JetBrains Mono", monospace; font-size: 11px; color: var(--muted-foreground); }

.runs-table { width: 100%; border-collapse: collapse; }
.runs-table th {
  text-align: left;
  font-size: 11px; font-weight: 600; letter-spacing: 0.025em; text-transform: uppercase;
  color: var(--muted-foreground);
  padding: 6px 12px;
  border-bottom: 1px solid var(--border);
}
.runs-table td { padding: 9px 12px; border-bottom: 1px solid var(--border); font-size: 0.75rem; vertical-align: middle; }
.runs-table tbody tr { cursor: pointer; }
.runs-table tbody tr:hover td { background: color-mix(in oklab, var(--muted) 40%, transparent); }
.runs-table .c-status { white-space: nowrap; }
.status-cell { display: inline-flex; align-items: center; gap: 7px; }
.status-cell i { width: 7px; height: 7px; border-radius: 9999px; background: var(--status); flex: none; }
.status-cell i.pulse { animation: pulse 1.6s ease-in-out infinite; }
.status-cell span { font-size: 11px; font-weight: 600; letter-spacing: 0.02em; text-transform: uppercase; color: var(--status); }
.runs-table .c-run { font-family: "JetBrains Mono", monospace; font-size: 12px; font-weight: 500; }
.runs-table .c-task { line-height: 1.4; }
.runs-table .c-issue { font-family: "JetBrains Mono", monospace; color: var(--muted-foreground); }
.runs-table .c-time { font-family: "JetBrains Mono", monospace; font-size: 11px; color: var(--muted-foreground); white-space: nowrap; }
.runs-table .c-time .c-ago { margin-left: 8px; }
.runs-table .c-dur { font-family: "JetBrains Mono", monospace; font-size: 11px; white-space: nowrap; }
.runs-table .c-result { max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.c-pr { font-family: "JetBrains Mono", monospace; font-size: 11px; text-decoration: none; border-bottom: 1px solid var(--border-strong); }
.c-muted { color: var(--muted-foreground); font-size: 11px; }

/* ---------------------------------------------------------------- run header */
.run-header { padding: 16px 20px 14px; border-bottom: 1px solid var(--border); display: grid; gap: 12px; }
.run-header .rh-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.run-header .rh-id { font-family: "JetBrains Mono", monospace; font-size: 1rem; font-weight: 600; }
.sse-note { font-family: "JetBrains Mono", monospace; font-size: 11px; color: var(--muted-foreground); display: flex; align-items: center; gap: 6px; }
.meta-table { width: 100%; border-collapse: collapse; }
.meta-table th {
  text-align: left; vertical-align: top;
  width: 92px; padding: 5px 16px 5px 0;
  font-family: "JetBrains Mono", monospace; font-size: 11px; font-weight: 400;
  color: var(--muted-foreground); white-space: nowrap;
}
.meta-table td { padding: 5px 0; font-size: 0.75rem; word-break: break-word; }
.meta-table td.mono { font-family: "JetBrains Mono", monospace; font-size: 11px; }
.meta-table a { text-decoration: none; border-bottom: 1px solid var(--border-strong); }

/* ---------------------------------------------------------------- tabs / switcher */
.viewbar {
  position: sticky; top: 0; z-index: 5;
  display: flex; align-items: center; gap: 10px;
  padding: 10px 20px;
  background: color-mix(in oklab, var(--background) 88%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border);
}
.tabs {
  display: inline-flex; gap: 2px;
  background: var(--muted);
  border-radius: 12px; padding: 3px;
}
.tabs button {
  border-radius: 10px;
  padding: 5px 12px;
  font-size: 0.75rem;
  color: var(--muted-foreground);
}
.tabs button[aria-selected="true"] {
  background: var(--card);
  color: var(--on-surface);
  box-shadow: 0 1px 2px color-mix(in oklab, var(--on-surface) 14%, transparent);
}
.viewbar .spacer { flex: 1; }

/* ---------------------------------------------------------------- steps */
.steps { padding: 12px 20px 60px; display: grid; gap: 6px; max-width: 1020px; }
.step-item { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 12px; position: relative; }
.step-index { position: relative; display: flex; justify-content: center; align-items: flex-start; }
.step-index .num {
  width: 22px; height: 22px; margin-top: 10px; border-radius: 9999px;
  display: grid; place-items: center;
  font-family: "JetBrains Mono", monospace; font-size: 10px; font-weight: 500;
  background: var(--card);
  border: 1px solid var(--status, var(--border-strong));
  color: var(--status, var(--muted-foreground));
  z-index: 1;
}
.step-index::after {
  content: ""; position: absolute; left: 50%; transform: translateX(-50%);
  top: 32px; bottom: -7px; width: 1px; background: var(--border-strong);
}
.step-item:last-child .step-index::after { display: none; }
.step-item.pending .step-index::after { background: transparent; border-left: 1px dotted var(--border-strong); width: 0; }
.step-item.pending .step-index .num { border-style: dotted; color: var(--muted-foreground); border-color: var(--border-strong); }
.step-index .num.dot { width: 8px; height: 8px; margin-top: 18px; border: none; background: var(--border-strong); }
.step-row {
  display: grid;
  grid-template-columns: 116px 78px 66px minmax(0, 1fr) auto 20px;
  align-items: center; gap: 12px;
  width: 100%;
  padding: 11px 14px;
  background: var(--card);
  border: 1px solid var(--border);
  border-left: 3px solid var(--status, var(--border));
  text-align: left;
}
.step-row:hover { border-color: var(--border-strong); border-left-color: var(--status, var(--border-strong)); }
.step-row[aria-current="true"] { outline: 2px solid var(--ring); outline-offset: 1px; }
.step-row.pending { border-style: dashed; border-left-style: solid; opacity: 0.6; cursor: default; }
.step-kind { font-size: 11px; font-weight: 600; letter-spacing: 0.025em; text-transform: uppercase; color: var(--muted-foreground); }
.step-time { font-family: "JetBrains Mono", monospace; font-size: 11px; color: var(--on-surface); white-space: nowrap; }
.step-name { font-family: "JetBrains Mono", monospace; font-size: 12px; font-weight: 500; word-break: break-word; min-width: 0; }
.step-meta { font-family: "JetBrains Mono", monospace; font-size: 11px; color: var(--muted-foreground); white-space: nowrap; text-align: right; }
.step-arrow { color: var(--muted-foreground); text-align: right; }

/* transcript */
.transcript { display: grid; gap: 10px; }
.msg { display: grid; gap: 4px; }
.msg .m-role { font-size: 11px; font-weight: 600; letter-spacing: 0.025em; text-transform: uppercase; color: var(--muted-foreground); }
.msg .m-text { font-size: 0.75rem; line-height: 1.625; }
.msg.reasoning .m-text { color: var(--muted-foreground); font-style: italic; }
.chevron { color: var(--muted-foreground); flex: none; transition: transform 0.15s ease; }
details[open] > summary .chevron { transform: rotate(90deg); }

/* collapsibles — tool calls in the transcript, disclosures in the inspector */
.tool-call, .disclosure, .disclosure-trigger {
  border: 1px solid var(--border);
  background: color-mix(in oklab, var(--muted) 45%, transparent);
}
.tool-call > summary, .disclosure > summary, .disclosure-trigger {
  cursor: pointer;
  list-style: none;
  display: flex; align-items: center; gap: 8px;
  padding: 8px 10px;
  width: 100%;
  font-family: "JetBrains Mono", monospace; font-size: 11px;
}
.tool-call > summary::-webkit-details-marker, .disclosure > summary::-webkit-details-marker { display: none; }
.tool-call > summary:hover, .disclosure > summary:hover, .disclosure-trigger:hover { color: var(--on-surface); }
.tool-call .tc-icon, .disclosure .disc-icon { color: var(--muted-foreground); flex: none; }
.tool-call .tc-args { color: var(--muted-foreground); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.disc-hint { margin-left: auto; color: var(--muted-foreground); }
.tool-call .tc-body, .disclosure .disc-body { border-top: 1px solid var(--border); padding: 8px 10px; font-family: "JetBrains Mono", monospace; font-size: 11px; white-space: pre-wrap; word-break: break-word; color: var(--muted-foreground); max-height: 260px; overflow-y: auto; }
.disclosure .disc-body { max-height: none; }
.disclosure .disc-body .json-block { margin: 0; border: none; background: none; padding: 0; max-height: 240px; }
.disclosure-trigger { text-align: left; }
.disclosure-trigger .disc-hint { color: var(--muted-foreground); }
.insp-back { font-family: "JetBrains Mono", monospace; font-size: 11px; color: var(--muted-foreground); padding: 2px 0; }
.insp-back:hover { color: var(--on-surface); }
.prompt-block {
  border: 1px solid var(--border);
  background: color-mix(in oklab, var(--muted) 45%, transparent);
  padding: 10px 12px;
  font-family: "JetBrains Mono", monospace; font-size: 11px; line-height: 1.6;
  white-space: pre-wrap; word-break: break-word;
}

/* exec terminal */
.term {
  background: var(--term-bg);
  color: var(--term-fg);
  border: 1px solid var(--border);
}
.term .term-head {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px;
  border-bottom: 1px solid color-mix(in oklab, var(--term-fg) 12%, transparent);
  font-family: "JetBrains Mono", monospace; font-size: 11px;
}
.term .term-head .prompt { color: var(--st-complete); }
.term pre {
  padding: 10px 12px;
  font-family: "JetBrains Mono", monospace; font-size: 11px; line-height: 1.55;
  overflow-x: auto;
  max-height: 320px; overflow-y: auto;
}
.term .stderr { color: var(--st-blocked); }

/* write-back */
.pr-chip {
  display: inline-flex; align-items: center; gap: 7px;
  border: 1px solid var(--border-strong);
  border-radius: 10px;
  padding: 6px 10px;
  font-family: "JetBrains Mono", monospace; font-size: 11px;
  text-decoration: none;
  width: fit-content;
}
.pr-chip:hover { outline: 2px solid var(--ring); outline-offset: 1px; }

.json-block {
  background: color-mix(in oklab, var(--muted) 45%, transparent);
  border: 1px solid var(--border);
  padding: 10px 12px;
  font-family: "JetBrains Mono", monospace; font-size: 11px; line-height: 1.55;
  overflow-x: auto;
  white-space: pre;
  max-height: 300px; overflow-y: auto;
}
.streaming-cursor { display: inline-block; width: 7px; height: 13px; background: var(--ring); vertical-align: -2px; animation: pulse 1s steps(2) infinite; }

/* ---------------------------------------------------------------- events table */
.events-table { width: 100%; border-collapse: collapse; font-size: 0.75rem; }
.events-table th {
  text-align: left;
  font-size: 11px; font-weight: 600; letter-spacing: 0.025em; text-transform: uppercase;
  color: var(--muted-foreground);
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; background: var(--background);
}
.events-table td { padding: 6px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
.events-table tr { cursor: pointer; }
.events-table tr:hover td { background: color-mix(in oklab, var(--muted) 40%, transparent); }
.events-table tr[aria-current="true"] td { background: color-mix(in oklab, var(--ring) 18%, transparent); }
.events-table .seq, .events-table .ts, .events-table .tag { font-family: "JetBrains Mono", monospace; font-size: 11px; }
.events-table .tag { font-weight: 500; }
.events-table .sum { font-family: "JetBrains Mono", monospace; font-size: 11px; color: var(--muted-foreground); word-break: break-word; }

/* ---------------------------------------------------------------- inspector */
.insp-head {
  height: 40px; display: flex; align-items: center; gap: 8px;
  padding: 0 12px;
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; background: var(--background); z-index: 2;
}
.insp-body { padding: 14px 12px 40px; display: grid; gap: 18px; }
.insp-section { display: grid; gap: 8px; }
.insp-section .section-label { margin-bottom: 2px; }
.kv-list { display: grid; gap: 6px; }
.kv-list .row { display: flex; gap: 10px; font-size: 0.75rem; }
.kv-list .row .k { flex: none; width: 96px; color: var(--muted-foreground); font-family: "JetBrains Mono", monospace; font-size: 11px; }
.kv-list .row .v { font-family: "JetBrains Mono", monospace; font-size: 11px; word-break: break-all; min-width: 0; }
.findings { display: grid; gap: 6px; font-size: 0.75rem; color: var(--muted-foreground); }
.findings .f { border-left: 2px solid var(--st-blocked); padding-left: 8px; line-height: 1.375; }
.findings .f.warn { border-left-color: var(--st-ready); }

/* ---------------------------------------------------------------- empty state */

/* ---------------------------------------------------------------- responsive */
.backdrop { display: none; }
@media (max-width: 1200px) {
  .shell { grid-template-columns: minmax(210px, 24%) 1fr; }
  .inspector {
    position: fixed; top: 56px; right: 0; bottom: 0;

}
@media (max-width: 940px) {
  .shell { grid-template-columns: 1fr; }

  .nav.open { transform: translateX(0); }
  .hamburger { display: grid; }
  .backdrop {
    display: block; position: fixed; inset: 56px 0 0 0;
    background: color-mix(in oklab, var(--on-surface) 30%, transparent);
    z-index: 30; opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
  }
  .backdrop.show { opacity: 1; pointer-events: auto; }
}
@media (max-width: 720px) {
  .brand-sub, .sim-badge { display: none; }
  .inspector { width: 100vw; max-width: 100vw; top: auto; height: 80vh; border-left: none; border-top: 1px solid var(--border); transform: translateY(105%); }

const $ = (sel) => document.querySelector(sel);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const pad2 = (n) => String(n).padStart(2, "0");
const fmtClock = (ts) => { const d = new Date(ts); return `${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`; };
const fmtDur = (ms) => {
  if (ms == null) return "…";
  const s = Math.round(ms / 1000);
  if (s < 60) return `${s}s`;
  const m = Math.floor(s / 60);
  return `${m}m ${pad2(s % 60)}s`;
};
const fmtAgo = (ts) => {
  const s = Math.max(0, Math.round((Date.now() - ts) / 1000));
  if (s < 60) return `${s}s ago`;
  const m = Math.floor(s / 60);
  if (m < 60) return `${m}m ago`;
  const h = Math.floor(m / 60);
  return `${h}h ${m % 60}m ago`;
};
const shortId = (runId) => runId.replace(/^run-\d{10}/, "…");
const statusLabel = { running: "running", finished: "finished", failed: "failed", cancelled: "cancelled", interrupted: "interrupted" };

/* per-activity display status → [data-status] value */
function actStatus(a) {
  if (a.kind === "pending") return null;
  if (a.kind === "exec") return a.dead ? "interrupted" : (a.exitCode === 0 ? "complete" : "failed");
  if (a.kind === "assert") return a.pass ? "pass" : "fail";
  if (a.kind === "agent") return a.outcome === "running" ? "running" : a.outcome;
  if (a.kind === "writeback") return a.outcome;
  return null;
}

/* ============================================================ runs page */
function resultCell(r) {

  if (r.status === "failed") return `<span class="c-muted" title="${esc(r.terminal?.message ?? "")}">${esc(r.terminal?.message ?? "failed")}</span>`;
  return `<span class="c-muted">—</span>`;
}

function runRow(r) {
  const known = r.durationMs ?? (r.finishedAt ? r.finishedAt - r.startedAt : null);
  const dur = r.status === "running"
    ? `<span data-live-dur="${r.startedAt}">${fmtDur(Date.now() - r.startedAt)}</span>`

    <td class="c-status"><span class="status-cell" data-status="${r.status}"><i class="${r.status === "running" ? "pulse" : ""}"></i><span>${statusLabel[r.status]}</span></span></td>

    <td class="c-dur">${dur}</td>

}

/* ---------------- steps + transcript ---------------- */
function transcriptHtml(items, live) {
  return items.map((it) => {
    if (it.t === "reasoning") return `<div class="msg reasoning"><span class="m-role">reasoning</span><span class="m-text">${esc(it.text)}</span></div>`;
    if (it.t === "text") return `<div class="msg"><span class="m-role">assistant</span><span class="m-text">${esc(it.text)}</span></div>`;
    return `<details class="tool-call"><summary>${ICON.terminal}<span>${esc(it.name)}</span><span class="tc-args">${esc(it.args)}</span><span class="pill neutral" style="margin-left:auto">result</span></summary><div class="tc-body">${esc(it.result)}</div></details>`;
  }).join("") + (live ? `<span class="streaming-cursor"></span>` : "");
}

const STEP_LABEL = { complete: "complete", completed: "complete", failed: "failed", pass: "pass", fail: "fail", running: "running", interrupted: "interrupted", cancelled: "cancelled" };

function stepStatusHtml(a) {
  if (a.kind === "pending") {
    return `<span class="status-cell" style="--status:var(--muted-foreground)"><i></i><span>pending</span></span>`;
  }
  const st = actStatus(a);
  return `<span class="status-cell" data-status="${st}"><i class="${st === "running" ? "pulse" : ""}"></i><span>${STEP_LABEL[st] ?? st}</span></span>`;
}

function stepParts(a, i) {
  if (a.kind === "agent") return { kindLabel: "agent", name: a.name, time: stepTimeHtml(a), meta: a.outcome === "running" ? `${a.chunkCount} chunks · streaming` : `${a.chunkCount} chunks`, key: a.id ?? i };
  if (a.kind === "exec") return { kindLabel: "exec", name: `$ ${a.command.join(" ")}`, time: stepTimeHtml(a), meta: a.dead ? "killed mid-exec" : `exit ${a.exitCode}`, key: a.id ?? i };
  if (a.kind === "assert") return { kindLabel: "assert", name: a.name, time: stepTimeHtml(a), meta: a.pass ? "passed" : "failed", key: a.id ?? a.name ?? i };
  if (a.kind === "writeback") return { kindLabel: "write-back", name: a.branch, time: stepTimeHtml(a), meta: a.prUrl ? `pr #${a.prUrl.split("/").pop()}` : (a.error ?? "no pr"), key: a.id ?? "wb" };
  if (a.kind === "pending") return { kindLabel: a.what, name: a.name, time: "—", meta: "waiting", key: a.id ?? a.name ?? i };
  return { kindLabel: a.kind, name: a.kind, time: "—", meta: "", key: i };
}

/* the step's own elapsed time; live for the in-flight step, "—" where none is recorded */
function stepTimeHtml(a) {
  if (a.kind === "agent" && a.outcome === "running") {
    const start = a.startedAt ?? Date.now();
    return `<span data-live-dur="${start}">${fmtDur(Date.now() - start)}</span>`;
  }
  if (a.durationMs == null) return "—";
  return fmtDur(a.durationMs);
}

function terminalRow(st, kind, time, name, meta) {
  return `<div class="step-row" data-status="${st}" style="cursor:default">
    <span class="status-cell" data-status="${st}"><i></i><span>${STEP_LABEL[st]}</span></span>
    <span class="step-kind">${esc(kind)}</span>
    <span class="step-time">${time}</span>
    <span class="step-name">${esc(name)}</span>
    <span class="step-meta">${esc(meta)}</span>
    <span></span>
  </div>`;
}

function renderSteps(r) {
  let idx = 0;
  const item = (pending, numHtml, rowHtml) =>
    `<div class="step-item ${pending ? "pending" : ""}"><div class="step-index">${numHtml}</div>${rowHtml}</div>`;

  const items = r.activities.map((a, i) => {
    const key = `${r.runId}:${a.id ?? a.name ?? i}`;
    const p = stepParts(a, i);
    idx += 1;
    if (a.kind === "pending") {
      const row = `<div class="step-row pending">
        ${stepStatusHtml(a)}
        <span class="step-kind">${esc(p.kindLabel)}</span>
        <span class="step-time">${p.time}</span>
        <span class="step-name">${esc(p.name)}</span>
        <span class="step-meta">waiting</span>
        <span></span>
      </div>`;
      return item(true, `<span class="num">${idx}</span>`, row);
    }
    const st = actStatus(a);
    const row = `<button class="step-row" data-status="${st}" data-act="${esc(key)}" aria-current="${state.selectedAct === key}">
      ${stepStatusHtml(a)}
      <span class="step-kind">${esc(p.kindLabel)}</span>
      <span class="step-time">${p.time}</span>
      <span class="step-name">${esc(p.name)}</span>
      <span class="step-meta">${esc(p.meta)}</span>
      <span class="step-arrow">›</span>
    </button>`;
    return item(false, `<span class="num" data-status="${st}">${idx}</span>`, row);
  });

  let terminal = "";
  if (r.terminal) {
    const st = r.terminal.tag === "RunFailed" ? "failed" : "cancelled";
    const name = r.terminal.tag === "RunFailed" ? r.terminal.message : "run cancelled";
    terminal = terminalRow(st, "run", fmtDur(r.terminal.durationMs), name, "");
  } else if (r.status === "interrupted") {
    terminal = terminalRow("interrupted", "run", "—", "process died mid-run", "no terminal event");
  } else if (r.status === "finished") {
    terminal = terminalRow("complete", "run", fmtDur(r.durationMs), "RunFinished", "");
  }
  if (terminal) items.push(item(false, `<span class="num dot"></span>`, terminal));

  $("#stepsView").innerHTML = `<div class="steps">${items.join("")}</div>`;
  $("#stepsView").querySelectorAll("[data-act]").forEach((el) =>
    el.addEventListener("click", () => { state.selectedAct = el.dataset.act; state.transcriptOpen = false; renderSteps(r); renderInspector(); openInspector(); }));
}

/* ---------------- events (raw table) ---------------- */
function deriveEvents(r) {
  const rows = [];
  let seq = 0;
  let ts = r.startedAt;
  const push = (tag, summary, raw) => rows.push({ seq: seq++, ts: (ts += 700 + ((seq * 613) % 900)), tag, summary, raw });
  push("RunStarted", `${r.workflowId} · issue #${r.input.issueNumber}`, { workflowId: r.workflowId, dir: r.dir, input: r.input });
  for (const a of r.activities) {
    if (a.kind === "pending") continue;
    if (a.kind === "agent") {
      push("AgentStepStarted", `${a.name} · ${a.model}`, { stepId: a.id, name: a.name, model: a.model, prompt: "…", structured: a.structured });
      for (const it of a.transcript) {
        if (it.t === "reasoning") push("AgentChunk", "REASONING_MESSAGE_CONTENT · " + it.text.slice(0, 64) + "…", { stepId: a.id, chunkType: "REASONING_MESSAGE_CONTENT", chunk: { type: "REASONING_MESSAGE_CONTENT", delta: it.text } });
        else if (it.t === "text") push("AgentChunk", "TEXT_MESSAGE_CONTENT · " + it.text.slice(0, 64) + (it.text.length > 64 ? "…" : ""), { stepId: a.id, chunkType: "TEXT_MESSAGE_CONTENT", chunk: { type: "TEXT_MESSAGE_CONTENT", delta: it.text } });
        else {
          push("AgentChunk", `TOOL_CALL_END · ${it.name} ${it.args}`, { stepId: a.id, chunkType: "TOOL_CALL_END", chunk: { type: "TOOL_CALL_END", toolCallName: it.name } });
          push("AgentChunk", `TOOL_CALL_RESULT · ${it.name}`, { stepId: a.id, chunkType: "TOOL_CALL_RESULT", chunk: { type: "TOOL_CALL_RESULT", content: it.result } });
        }
      }
      push("AgentChunk", "CUSTOM · opencode.session-id", { stepId: a.id, chunkType: "CUSTOM", chunk: { type: "CUSTOM", name: "opencode.session-id", value: a.sessionId } });
      push("AgentStepFinished", `${a.name} · ${a.outcome} · ${a.chunkCount} chunks · ${fmtDur(a.durationMs)}`, { stepId: a.id, name: a.name, outcome: a.outcome === "running" ? "…" : a.outcome, chunkCount: a.chunkCount, durationMs: a.durationMs ?? 0, finalText: a.finalText ?? "", ...(a.output ? { output: a.output } : {}), sessionId: a.sessionId });
    }
    if (a.kind === "exec") {
      push("ExecStarted", `$ ${a.command.join(" ")}`, { execId: a.id, command: a.command, cwd: a.cwd });
      if (!a.dead) push("ExecFinished", `exit ${a.exitCode} · ${fmtDur(a.durationMs)}`, { execId: a.id, command: a.command, exitCode: a.exitCode, stdout: a.stdout, stderr: a.stderr, durationMs: a.durationMs });
    }
    if (a.kind === "assert") push("AssertionRecorded", `${a.name} · ${a.pass ? "pass" : "FAIL"}`, { name: a.name, pass: a.pass, ...(a.details ? { details: a.details } : {}) });
    if (a.kind === "writeback") {
      push("WriteBackStarted", a.branch, { branch: a.branch });
      (a.commands ?? []).forEach((c, i) => push("ExecFinished", `$ ${c.join(" ")} · exit 0`, { execId: `wb-${i}`, command: c, exitCode: 0, stdout: "", stderr: "", durationMs: 120 + i * 40 }));
      push("WriteBackFinished", `${a.branch} · ${a.outcome}${a.prUrl ? " · pr #" + a.prUrl.split("/").pop() : ""}`, { branch: a.branch, outcome: a.outcome, cleanedArtifacts: a.cleanedArtifacts, stagedPaths: a.stagedPaths, ...(a.prUrl ? { prUrl: a.prUrl } : {}), ...(a.error ? { error: a.error } : {}) });
    }
  }
  if (r.terminal) push(r.terminal.tag, r.terminal.tag === "RunFailed" ? r.terminal.message : fmtDur(r.terminal.durationMs), r.terminal);
  else if (r.status === "finished") push("RunFinished", fmtDur(r.durationMs), { output: r.output, durationMs: r.durationMs });
  return rows;
}

function renderEvents(r) {
  const rows = deriveEvents(r);
  const body = rows.map((e, i) => `<tr data-ev="${i}" aria-current="false"><td class="seq">${e.seq}</td><td class="ts">${fmtClock(e.ts)}</td><td class="tag">${esc(e.tag)}</td><td class="sum">${esc(e.summary)}</td></tr>`).join("");
  $("#eventsView").innerHTML = `<table class="events-table"><thead><tr><th style="width:48px">seq</th><th style="width:76px">ts</th><th style="width:180px">tag</th><th>summary</th></tr></thead><tbody>${body}</tbody></table>`;
  $("#eventsView").querySelectorAll("[data-ev]").forEach((el) =>
    el.addEventListener("click", () => {
      $("#eventsView").querySelectorAll("[aria-current]").forEach((x) => x.setAttribute("aria-current", "false"));
      el.setAttribute("aria-current", "true");
      const e = rows[Number(el.dataset.ev)];
      state.transcriptOpen = false;
      renderInspRaw(r, e);
      openInspector();
    }));
}

/* ============================================================ inspector */
function kv(k, v) { return `<div class="row"><span class="k">${esc(k)}</span><span class="v">${v}</span></div>`; }

function renderInspDefault() {
  $("#inspTitle").textContent = "Factory";
  const counts = ["running", "finished", "failed", "interrupted", "cancelled"].map((s) => [s, RUNS.filter((r) => r.status === s).length]);
  $("#inspBody").innerHTML = `
    <div class="insp-section"><span class="section-label">Runs</span><div class="kv-list">
      ${counts.map(([s, n]) => kv(s, `<span class="pill" data-status="${s}">${n}</span>`)).join("")}
    </div></div>
    <div class="insp-section"><span class="section-label">Dispatch</span><div class="kv-list">
      ${kv("source", esc(DISPATCH.source))}
      ${kv("project", `${esc(DISPATCH.project)} #${DISPATCH.projectNumber}`)}
      ${kv("wip", `${DISPATCH.wip.active}/${DISPATCH.wip.max}`)}
      ${kv("ready", String(DISPATCH.ready.length))}
      ${kv("backoff", String(DISPATCH.backoff.length))}
    </div></div>
    <div class="insp-section"><span class="section-label">Hint</span>
      <div class="findings"><div class="f" style="border-left-color:var(--border-strong)">Select a step for its transcript, terminal output or raw payload; select an event row for its payload.</div></div>
    </div>`;
}

function renderInspector() {
  const r = run(state.selectedRunId);
  if (!r) return renderInspDefault();
  if (!state.selectedAct) return renderInspRun(r);
  const act = r.activities.find((a, i) => `${r.runId}:${a.id ?? a.name ?? i}` === state.selectedAct);
  if (!act) return renderInspRun(r);
  renderInspActivity(r, act);
}

function renderInspRun(r) {
  $("#inspTitle").textContent = "Run overview";
  const sessions = r.activities.filter((a) => a.kind === "agent" && a.sessionId);
  const findings = [];
  if (r.status === "failed") findings.push({ t: r.terminal?.message ?? "failed", cls: "" }, { t: "write-back owns git; the agent never ran it. push rejected — remote branch already exists from an earlier attempt.", cls: "" });
  if (r.status === "interrupted") findings.push({ t: "last event is ExecStarted with no ExecFinished — the process was killed mid-exec.", cls: "warn" });
  if (r.status === "cancelled") findings.push({ t: "cancelled mid TEXT_MESSAGE; the harness emits no terminal chunk on abort — only Factory records it.", cls: "warn" });
  const wb = r.activities.find((a) => a.kind === "writeback");
  if (wb?.cleanedArtifacts?.length) findings.push({ t: `D16 stray-artifact workaround cleaned: ${wb.cleanedArtifacts.join(", ")}`, cls: "warn" });
  $("#inspBody").innerHTML = `
    <div class="insp-section"><span class="section-label">Run</span><div class="kv-list">
      ${kv("runId", esc(r.runId))}
      ${kv("workflow", esc(r.workflowId))}
      ${kv("status", `<span class="pill" data-status="${r.status}">${statusLabel[r.status]}</span>`)}
      ${kv("started", fmtClock(r.startedAt) + " · " + fmtAgo(r.startedAt))}
      ${r.finishedAt ? kv("finished", fmtClock(r.finishedAt)) : ""}
      ${kv("events", String(deriveEvents(r).length))}
      ${kv("dir", esc(r.dir))}
    </div></div>
    <div class="insp-section"><span class="section-label">Input</span><pre class="json-block">${esc(JSON.stringify(r.input, null, 2))}</pre></div>
    ${r.output ? `<div class="insp-section"><span class="section-label">Output</span><pre class="json-block">${esc(JSON.stringify(r.output, null, 2))}</pre></div>` : ""}
    ${sessions.length ? `<div class="insp-section"><span class="section-label">Sessions · fresh per step (D10)</span><div class="kv-list">${sessions.map((s) => kv(s.name, esc(s.sessionId))).join("")}</div></div>` : ""}
    ${findings.length ? `<div class="insp-section"><span class="section-label">Findings · ${findings.length}</span><div class="findings">${findings.map((f) => `<div class="f ${f.cls}">${esc(f.t)}</div>`).join("")}</div></div>` : ""}`;
}

function agentPrompt(r, a) {
  if (a.prompt) return a.prompt;
  if (a.name === "implement") return `You are implementing issue #${r.input.issueNumber} in ${r.input.repoSlug}.\n\n${r.desc}\n\nWork in the current directory. Implement the change in src/index.ts, add tests in src/index.test.ts, and run bun test. Do not run any git command — Factory handles write-back.`;
  if (a.name === "fix" || a.name === "review") return `The implementation for issue #${r.input.issueNumber} is in the tree and bun test has just run. Review it critically, fix any bug or missing edge case, and re-run bun test. Do not run any git command — Factory handles write-back.`;
  if (a.name === "pr-metadata") return `Read the working-tree diff for issue #${r.input.issueNumber} and return only a JSON object: {"title": string, "body": string}. The title references the issue; the body is a short markdown summary of the change.`;
  return `Continue work on issue #${r.input.issueNumber}.`;
}

function disclosure(label, hint, body) {
  return `<details class="disclosure"><summary>${ICON.chevron}<span>${esc(label)}</span>${hint ? `<span class="disc-hint">${esc(hint)}</span>` : ""}</summary><div class="disc-body">${body}</div></details>`;
}

function renderInspTranscript(r, a) {
  $("#inspTitle").textContent = `transcript · ${a.name}`;
  $("#inspBody").innerHTML = `
    <div class="insp-section"><button class="insp-back" id="inspBack">‹ ${esc(a.name)}</button></div>
    <div class="insp-section"><span class="section-label">Prompt</span><div class="prompt-block">${esc(agentPrompt(r, a))}</div></div>
    <div class="insp-section"><span class="section-label">Transcript</span><div class="transcript">${transcriptHtml(a.transcript, a.outcome === "running")}</div></div>`;
  $("#inspBack").addEventListener("click", () => { state.transcriptOpen = false; renderInspector(); });
}

function renderInspActivity(r, a) {
  if (a.kind === "agent" && state.transcriptOpen) return renderInspTranscript(r, a);
  const statusCell = (s) => `<span class="status-cell" data-status="${s}"><i></i><span>${STEP_LABEL[s] ?? s}</span></span>`;
  $("#inspTitle").textContent = a.kind === "agent" ? `step ${a.name}` : a.kind === "writeback" ? "write-back" : a.kind;
  let rows = "";
  const parts = [];
  let raw = {};
  if (a.kind === "agent") {
    rows = kv("stepId", esc(a.id)) + kv("model", esc(a.model)) + kv("structured", String(a.structured)) + kv("outcome", statusCell(a.outcome === "running" ? "running" : a.outcome)) + kv("chunks", String(a.chunkCount)) + kv("duration", fmtDur(a.durationMs)) + kv("sessionId", esc(a.sessionId ?? "—"));
    parts.push(`<button class="disclosure-trigger" id="openTranscript">${ICON.chevron}<span>Transcript</span><span class="disc-hint">${a.transcript.length} parts · prompt + messages</span></button>`);
    if (a.output) parts.push(disclosure("Structured output", "", `<pre class="json-block">${esc(JSON.stringify(a.output, null, 2))}</pre>`));
    if (a.note) parts.push(disclosure("Note", "", `<div class="findings"><div class="f warn">${esc(a.note)}</div></div>`));
    raw = { _tag: "AgentStepFinished", stepId: a.id, name: a.name, outcome: a.outcome, chunkCount: a.chunkCount, durationMs: a.durationMs ?? 0, finalText: a.finalText ?? "", ...(a.output ? { output: a.output } : {}), sessionId: a.sessionId };
  } else if (a.kind === "exec") {
    rows = kv("execId", esc(a.id)) + kv("command", esc(a.command.join(" "))) + kv("cwd", esc(a.cwd)) + (a.dead ? kv("exit", statusCell("interrupted")) : kv("exitCode", `<span class="pill" data-status="${a.exitCode === 0 ? "complete" : "failed"}">${a.exitCode}</span>`)) + kv("duration", fmtDur(a.durationMs));
    parts.push(disclosure("Output", a.dead ? "" : `exit ${a.exitCode}`, a.dead
      ? `<div class="findings"><div class="f warn">Process died mid-exec — no ExecFinished event in the log.</div></div>`
      : `<div class="term"><div class="term-head"><span class="prompt">$</span><span>${esc(a.command.join(" "))}</span></div><pre>${esc(a.stdout)}${a.stderr ? `\n<span class="stderr">${esc(a.stderr)}</span>` : ""}</pre></div>`));
    raw = a.dead ? { _tag: "ExecStarted", execId: a.id, command: a.command, cwd: a.cwd } : { _tag: "ExecFinished", execId: a.id, command: a.command, exitCode: a.exitCode, stdout: a.stdout, stderr: a.stderr, durationMs: a.durationMs };
  } else if (a.kind === "assert") {
    rows = kv("name", esc(a.name)) + kv("pass", statusCell(a.pass ? "pass" : "fail"));
    if (a.details) parts.push(disclosure("Details", "", `<pre class="json-block">${esc(JSON.stringify(a.details, null, 2))}</pre>`));
    raw = { _tag: "AssertionRecorded", name: a.name, pass: a.pass, ...(a.details ? { details: a.details } : {}) };
  } else if (a.kind === "writeback") {
    rows = kv("branch", esc(a.branch)) + kv("outcome", statusCell(a.outcome)) + kv("staged", esc(a.stagedPaths.join(", ") || "—")) + kv("cleaned", esc(a.cleanedArtifacts.join(", ") || "none")) + (a.error ? kv("error", esc(a.error)) : "");
    const cmds = (a.commands ?? []).map((c) => "$ " + c.join(" ")).join("\n");
    parts.push(disclosure("Commands", `${(a.commands ?? []).length}`, `<pre class="json-block">${esc(cmds || "—")}</pre>${a.failedStderr ? `<pre class="json-block" style="margin-top:8px;color:var(--st-blocked)">${esc(a.failedStderr)}</pre>` : ""}`));
    if (a.prUrl) parts.push(disclosure("Pull request", "", `<a class="pr-chip" href="${esc(a.prUrl)}" target="_blank" rel="noreferrer">${ICON.ext} ${esc(a.prUrl)}</a>`));
    raw = { _tag: "WriteBackFinished", branch: a.branch, outcome: a.outcome, cleanedArtifacts: a.cleanedArtifacts, stagedPaths: a.stagedPaths, ...(a.prUrl ? { prUrl: a.prUrl } : {}), ...(a.error ? { error: a.error } : {}) };
  }
  parts.push(disclosure("Raw payload", "RunEvent.payload", `<pre class="json-block">${esc(JSON.stringify(raw, null, 2))}</pre>`));
  $("#inspBody").innerHTML = `
    <div class="insp-section"><span class="section-label">Fields</span><div class="kv-list">${rows}</div></div>
    <div class="insp-section">${parts.join("")}</div>`;
  $("#openTranscript")?.addEventListener("click", () => { state.transcriptOpen = true; renderInspector(); });
}

function renderInspRaw(r, e) {
  $("#inspTitle").textContent = `event seq ${e.seq}`;
  $("#inspBody").innerHTML = `
    <div class="insp-section"><span class="section-label">Envelope</span><div class="kv-list">
      ${kv("runId", esc(r.runId))}${kv("seq", String(e.seq))}${kv("ts", `${fmtClock(e.ts)} · display only`)}${kv("tag", esc(e.tag))}
    </div></div>
    <div class="insp-section"><span class="section-label">Payload</span><pre class="json-block">${esc(JSON.stringify(e.raw, null, 2))}</pre></div>`;
}

/* ============================================================ sheets & theme */
const navEl = $("#nav"), inspEl = $("#inspector"), backdropEl = $("#backdrop");
function closeSheets() { navEl.classList.remove("open"); inspEl.classList.remove("open"); backdropEl.classList.remove("show"); }
function openInspector() { if (matchMedia("(max-width: 1200px)").matches) { inspEl.classList.add("open"); backdropEl.classList.add("show"); } }
$("#navToggle").addEventListener("click", () => { navEl.classList.toggle("open"); backdropEl.classList.toggle("show", navEl.classList.contains("open")); inspEl.classList.remove("open"); });
$("#inspToggle").addEventListener("click", () => { inspEl.classList.toggle("open"); backdropEl.classList.toggle("show", inspEl.classList.contains("open")); });
$("#inspClose").addEventListener("click", closeSheets);
backdropEl.addEventListener("click", closeSheets);
addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheets(); });

const themeBtn = $("#themeToggle");
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  themeBtn.innerHTML = t === "dark" ? ICON.sun : ICON.moon;
  try { localStorage.setItem("factory-mock-theme", t); } catch {}
}
themeBtn.addEventListener("click", () => { applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark"); syncUrl(); });

/* ============================================================ tabs */
$("#tabSteps").addEventListener("click", () => { state.view = "steps"; renderTabs(); syncUrl(); });
$("#tabEvents").addEventListener("click", () => { state.view = "events"; renderTabs(); syncUrl(); });

/* ============================================================ live simulation */
const liveRun = run("run-1789381260241");
const liveStep = () => liveRun.activities.find((a) => a.kind === "agent" && a.outcome === "running");
let queueIdx = 0;

function refreshLive() {
  if (state.area === "dispatch") renderDispatchPage();
  if (state.area === "runs" && state.selectedRunId === liveRun.runId) {
    renderRunHeader(liveRun);
    renderTabs();
    if (state.view === "steps") {
      const main = $("#main");
      const nearBottom = main.scrollHeight - main.scrollTop - main.clientHeight < 220;
      renderSteps(liveRun);
      if (state.follow && nearBottom) main.scrollTop = main.scrollHeight;
    } else renderEvents(liveRun);
    if (!state.selectedAct) renderInspector();
  } else if (state.area === "runs" && state.selectedRunId === null) {
  if (state.area === "runs" && state.selectedRunId === null) renderRunsPage();
  }
}

function replacePending(what, activity) {
  const i = liveRun.activities.findIndex((a) => a.kind === "pending" && a.what === what);
  if (i >= 0) liveRun.activities.splice(i, 1, activity);
  else liveRun.activities.push(activity);
}

function tick() {
  if (queueIdx >= LIVE_QUEUE.length) return;
  const step = LIVE_QUEUE[queueIdx++];
  switch (step.kind) {
    case "item": liveStep()?.transcript.push(step.item); break;
    case "finishStep": {
      const s = liveStep();
      if (s) { s.outcome = "completed"; s.chunkCount = step.chunkCount; s.durationMs = step.durationMs; s.finalText = step.finalText; s.sessionId = step.sessionId; if (step.output) s.output = step.output; }
      break;
    }
    case "assert": replacePending("assert", { kind: "assert", name: step.name, pass: step.pass, details: step.details }); break;
    case "exec": {
      const wb = liveRun.activities.find((a) => a.kind === "writeback");
      if (wb && step.quiet) { (wb.commands = wb.commands ?? []).push(step.command); }
      else replacePending("exec", { kind: "exec", id: step.id, command: step.command, cwd: step.cwd, exitCode: step.exitCode, stdout: step.stdout, stderr: step.stderr, durationMs: step.durationMs });
      break;
    }
    case "startStep": replacePending("agent", { kind: "agent", id: step.id, name: step.name, model: MODEL, structured: step.structured, outcome: "running", startedAt: Date.now(), chunkCount: 3, durationMs: null, sessionId: "…", transcript: [] }); break;
    case "wbStart": replacePending("writeback", { kind: "writeback", id: "wb-1", branch: step.branch, outcome: "running", stagedPaths: [], cleanedArtifacts: [], commands: [] }); break;
    case "wbFinish": {
      const wb = liveRun.activities.find((a) => a.kind === "writeback");
      if (wb) { wb.outcome = "completed"; wb.stagedPaths = step.stagedPaths; wb.cleanedArtifacts = step.cleanedArtifacts; wb.prUrl = step.prUrl; }
      break;
    }
    case "runFinish": {
      liveRun.status = "finished";
      liveRun.output = step.output;
      liveRun.durationMs = step.durationMs;
      liveRun.finishedAt = Date.now();
      state.liveDone = true;
      $("#liveDot").classList.remove("pulse");
      $("#liveLabel").textContent = "idle";
      setTimeout(dispatchFollowUp, 2600);
      break;
    }
  }
  refreshLive();
}

function dispatchFollowUp() {
  if (state.dispatchedFollowUp) return;
  state.dispatchedFollowUp = true;
  DISPATCH.inProgress = [];
  DISPATCH.wip.active = 0;
  const next = DISPATCH.ready.shift();
  DISPATCH.wip.active = 1;
  const newRun = {
    runId: "run-1789381309999",
    workflowId: "implement-issue",
    status: "running",
    startedAt: Date.now(),
    dir: DIR,
    input: { issueNumber: next.issue, branch: `factory/issue-${next.issue}-truncate`, repoSlug: REPO, baseBranch: "main" },
    desc: next.title,
    dispatched: true,
    activities: [
      { kind: "agent", id: "step-1", name: "implement", model: MODEL, structured: false, outcome: "running", startedAt: Date.now(), chunkCount: 4, durationMs: null, sessionId: "ses_d41c07be",
        transcript: [ { t: "reasoning", text: `Issue #${next.issue}: ${next.title}. Reading src/index.ts and src/index.test.ts first.` } ] },
      { kind: "pending", what: "exec", name: "bun test" },
      { kind: "pending", what: "agent", name: "fix" },
      { kind: "pending", what: "agent", name: "pr-metadata" },
      { kind: "pending", what: "writeback", name: "write-back" },
    ],
  };
  RUNS.unshift(newRun);
  DISPATCH.inProgress = [{ issue: next.issue, title: next.title, runId: newRun.runId }];
  $("#liveDot").classList.add("pulse");
  $("#liveLabel").textContent = "live";
  if (state.area === "dispatch") renderDispatchPage();
  if (state.area === "runs" && state.selectedRunId === null) renderRunsPage();
}

/* per-second: countdowns + live durations */
setInterval(() => {
  document.querySelectorAll("[data-countdown]").forEach((el) => {
    const ms = Number(el.dataset.countdown) - Date.now();
    el.textContent = ms > 0 ? `retry in ${fmtDur(ms)}` : "retry due";
  });
  document.querySelectorAll("[data-live-dur]").forEach((el) => {
    el.textContent = fmtDur(Date.now() - Number(el.dataset.liveDur));
  });
}, 1000);

/* follow-scroll tracking */
$("#main").addEventListener("scroll", () => {
  const main = $("#main");
  state.follow = main.scrollHeight - main.scrollTop - main.clientHeight < 220;
});

/* ============================================================ init */
function syncUrl() {
  const p = new URLSearchParams();
  p.set("area", state.area);
  if (state.selectedRunId) { p.set("run", state.selectedRunId); p.set("view", state.view); }
  p.set("theme", document.documentElement.dataset.theme);
  history.replaceState(null, "", "?" + p.toString());
}
const params = new URLSearchParams(location.search);
applyTheme(params.get("theme") ?? (() => { try { return localStorage.getItem("factory-mock-theme"); } catch { return null; } })() ?? (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"));
if (params.get("run") && run(params.get("run"))) {
  state.view = params.get("view") === "events" ? "events" : "steps";
  selectRun(params.get("run"));
} else {
  state.area = ["workflows", "dispatch", "runs"].includes(params.get("area")) ? params.get("area") : "runs";
  showArea(state.area);
}
setInterval(tick, 1400);
</script>
</body>
