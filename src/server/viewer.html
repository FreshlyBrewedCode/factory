<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>factory</title>
    <style>
      body {
        font-family: ui-monospace, monospace;
        margin: 2rem;
        background: #111;
        color: #ddd;
      }
      a {
        color: #6cf;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        margin-bottom: 1rem;
      }
      td,
      th {
        border-bottom: 1px solid #333;
        padding: 0.25rem 0.5rem;
        text-align: left;
      }
      #log {
        white-space: pre-wrap;
        background: #000;
        padding: 0.5rem;
        height: 60vh;
        overflow-y: auto;
      }
      .tag-RunFinished {
        color: #6f6;
      }
      .tag-RunFailed {
        color: #f66;
      }
      .tag-RunCancelled {
        color: #fa6;
      }
    </style>
  </head>
  <body>
    <h1>factory</h1>
    <table id="runs"></table>
    <div id="log"></div>
    <script>
      async function loadRuns() {
        const runs = await fetch("/api/runs").then((r) => r.json());
        const table = document.getElementById("runs");
        table.innerHTML =
          "<tr><th>run</th><th>workflow</th><th>status</th><th>events</th></tr>" +
          runs
            .map(
              (r) =>
                `<tr><td><a href="#" data-run="${r.runId}" onclick="watch('${r.runId}');return false;">${r.runId}</a></td><td>${r.workflowId ?? "?"}</td><td>${r.status}</td><td>${r.eventCount}</td></tr>`,
            )
            .join("");
      }

      let currentSource = null;
      function watch(runId) {
        if (currentSource) currentSource.close();
        const log = document.getElementById("log");
        log.textContent = "";
        currentSource = new EventSource(`/api/runs/${runId}/events`);
        currentSource.onmessage = (ev) => {
          const event = JSON.parse(ev.data);
          const line = document.createElement("div");
          line.className = `tag-${event.payload._tag}`;
          line.textContent = `[${event.seq}] ${event.payload._tag} ${JSON.stringify(event.payload)}`;
          log.appendChild(line);
          log.scrollTop = log.scrollHeight;
        };
      }

      loadRuns();
      setInterval(loadRuns, 5000);
    </script>
  </body>
</html>
