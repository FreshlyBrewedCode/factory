name: pr-title

# Squash-merge is the only merge strategy this repo allows, so a PR's title
# becomes the commit message semantic-release parses — this is the one place
# Conventional Commits are enforced.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  lint-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
